<svg xmlns="http://www.w3.org/2000/svg" width="800" height="940" viewBox="0 0 800 940"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="800" height="940" fill="#FFFFFF"/><rect x="60" y="30" width="200" height="56" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="160.0" y="54" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="15" font-weight="700" fill="#3C3489">Paper</text><text x="160.0" y="72" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="12" fill="#534AB7">ScienceDaily, MDPI, OpenAlex, PMC</text><polyline points="160,86 160,138" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="300" y="30" width="200" height="56" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="400.0" y="54" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="15" font-weight="700" fill="#3C3489">Social</text><text x="400.0" y="72" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="12" fill="#534AB7">Pantip, Reddit, YouTube</text><polyline points="400,86 400,138" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="540" y="30" width="200" height="56" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="640.0" y="54" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="15" font-weight="700" fill="#3C3489">News</text><text x="640.0" y="72" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="12" fill="#534AB7">RSS ข่าวไทย/สากล, Google News</text><polyline points="640,86 640,138" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="60" y="140" width="680" height="56" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="400.0" y="164" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="15" font-weight="700" fill="#3C3489">① - ⑤ สร้างเทรนด์ + คีย์เวิร์ด (LLM)</text><text x="400.0" y="182" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="12" fill="#534AB7">triplet + ประโยคหลักฐาน, Louvain โหวต 20 รอบ, 5 เทรนด์ต่อสาย = 15 เทรนด์</text><polyline points="400,196 400,248" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="250" y="250" width="300" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="400.0" y="274" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="15" font-weight="700" fill="#085041">⑦ พยากรณ์ Google Trends</text><text x="400.0" y="292" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="12" fill="#0F6E56">LLM + SerpAPI → Z_Delta</text><rect x="40" y="250" width="160" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="120.0" y="274" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="15" font-weight="700" fill="#2C2C2A">⑧-⑨ สรุประดับหมวด</text><text x="120.0" y="292" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="12" fill="#5F5E5A">ผลสรุป ไม่มีขั้นอื่นอ่านต่อ</text><polyline points="250,278 202,278" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/><rect x="600" y="250" width="160" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="6 4"/><text x="680.0" y="274" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="15" font-weight="700" fill="#2C2C2A">⑩ รอบค้นพบเพิ่ม</text><text x="680.0" y="292" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="12" fill="#5F5E5A">optional (ถาม)</text><polyline points="680,196 680,248" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/><polyline points="400,306 400,358" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="250" y="360" width="300" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="400.0" y="384" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="15" font-weight="700" fill="#085041">⑥ Rank Score</text><text x="400.0" y="402" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="12" fill="#0F6E56">Z_Delta × โบนัสข้ามสาย (+10%/สาย)</text><polyline points="400,416 400,468" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="250" y="470" width="300" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="400.0" y="494" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="15" font-weight="700" fill="#085041">⑪ จุดเด่น + คัด Top N (LLM)</text><text x="400.0" y="512" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="12" fill="#0F6E56">ข้ามช่องทาง แล้วเลื่อนอันดับถัดไปขึ้น</text><polyline points="400,526 400,578" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="250" y="580" width="300" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="400.0" y="604" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="15" font-weight="700" fill="#085041">⑫ จับคู่สินค้า Watsons (LLM)</text><text x="400.0" y="622" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="12" fill="#0F6E56">embedding 10,622 SKU, 4 หมวด x 3 ชิ้น</text><rect x="600" y="580" width="160" height="56" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1" stroke-dasharray="6 4"/><text x="680.0" y="604" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="15" font-weight="700" fill="#085041">⑬ ค้นหาแบรนด์</text><text x="680.0" y="622" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="12" fill="#0F6E56">Top 5 ต่อเทรนด์ (optional)</text><polyline points="550,608 598,608" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/><text x="574" y="600" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="11" fill="#5F5E5A">cache</text><polyline points="400,636 400,688" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="250" y="690" width="300" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="400.0" y="714" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="15" font-weight="700" fill="#2C2C2A">⑭-⑮ STEPIC + Master Report (LLM)</text><text x="400.0" y="732" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="12" fill="#5F5E5A">แรงขับ 6 ด้าน, สังเคราะห์รวม</text><rect x="600" y="690" width="160" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="6 4"/><text x="680.0" y="714" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="15" font-weight="700" fill="#2C2C2A">⑰ รายงานแบรนด์</text><text x="680.0" y="732" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="12" fill="#5F5E5A">PDF 1 ไฟล์ต่อแบรนด์</text><polyline points="680,636 680,688" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/><polyline points="400,746 400,798" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="250" y="800" width="300" height="56" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="400.0" y="824" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="15" font-weight="700" fill="#2C2C2A">⑯ รายงาน PDF เทรนด์ (EN + TH)</text><text x="400.0" y="842" text-anchor="middle" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="12" fill="#5F5E5A">ท้ายสุด ไม่จำเป็น, 35 หน้า</text><rect x="60" y="900" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text x="82" y="912" text-anchor="start" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="12" fill="#5F5E5A">หลักฐาน (LLM + โค้ดตรวจ)</text><rect x="290" y="900" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text x="312" y="912" text-anchor="start" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="12" fill="#5F5E5A">ตัวเลขกฎตายตัว</text><rect x="520" y="900" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="542" y="912" text-anchor="start" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="12" fill="#5F5E5A">รวม / รายงาน</text><rect x="736" y="900" width="14" height="14" rx="3" fill="none" stroke="#5F5E5A" stroke-dasharray="4 3"/><text x="728" y="912" text-anchor="end" font-family="Tahoma, 'Noto Sans Thai', sans-serif" font-size="12" fill="#5F5E5A">optional / ถามก่อนรัน</text></svg>