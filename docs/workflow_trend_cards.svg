<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>Trend workflow in five steps
  </title>
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#e0a21f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="m2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#17b832" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="m3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#1f9aa8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="m4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#7c6ae6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1600" height="560" fill="#ffffff"/>
  <text x="25" y="36" font-size="26" font-weight="700" fill="#2d2d2d">How the Trend system works
  </text>
  <!-- ===== arrows between cards ===== -->
    <path d="M297 235 H339" stroke="#e0a21f" stroke-width="4.5" stroke-linecap="round" marker-end="url(#m1)"/>
    <path d="M617 235 H659" stroke="#17b832" stroke-width="4.5" stroke-linecap="round" marker-end="url(#m2)"/>
    <path d="M937 235 H979" stroke="#1f9aa8" stroke-width="4.5" stroke-linecap="round" marker-end="url(#m3)"/>
    <path d="M1257 235 H1299" stroke="#7c6ae6" stroke-width="4.5" stroke-linecap="round" marker-end="url(#m4)"/>
    <!-- ===== 1 · Collect evidence ===== -->
      <g>
        <rect x="25" y="70" width="270" height="340" rx="22" fill="#fdf1dc" stroke="#f2b94d" stroke-width="3"/>
        <circle cx="160" cy="128" r="32" fill="#ffffff" stroke="#f2b94d" stroke-width="3"/>
        <g transform="translate(160,128)" fill="none" stroke="#2d2d2d" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="-4" cy="-4" r="11"/>
          <path d="M4 4 L15 15"/>
        </g>
        <text x="160" y="196" font-size="23" font-weight="700" text-anchor="middle" fill="#b7740b">Collect evidence
        </text>
        <g font-size="12.5" font-weight="600" text-anchor="middle" fill="#333">
          <rect x="41" y="214" width="76" height="26" rx="13" fill="#ffffff" stroke="#f2b94d" stroke-width="1.8"/>
          <text x="79" y="232">Papers
          </text>
          <rect x="123" y="214" width="76" height="26" rx="13" fill="#ffffff" stroke="#f2b94d" stroke-width="1.8"/>
          <text x="161" y="232">Social
          </text>
          <rect x="205" y="214" width="76" height="26" rx="13" fill="#ffffff" stroke="#f2b94d" stroke-width="1.8"/>
          <text x="243" y="232">News
          </text>
        </g>
        <g font-size="15" text-anchor="middle" fill="#444">
          <text x="160" y="272">Three teams, kept apart
          </text>
          <text x="160" y="298">Every fact quotes a real
          </text>
          <text x="160" y="320">source sentence
          </text>
        </g>
        <rect x="55" y="354" width="210" height="38" rx="19" fill="#ffffff" stroke="#f2b94d" stroke-width="2"/>
        <text x="160" y="379" font-size="15" font-weight="600" text-anchor="middle" fill="#333">Up to 15 trends
        </text>
        <circle cx="25" cy="70" r="17" fill="#f5a623"/>
        <text x="25" y="76" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">1
        </text>
      </g>
      <!-- ===== 2 · Forecast ===== -->
        <g>
          <rect x="345" y="70" width="270" height="340" rx="22" fill="#e9f9dd" stroke="#7fd67f" stroke-width="3"/>
          <circle cx="480" cy="128" r="32" fill="#ffffff" stroke="#7fd67f" stroke-width="3"/>
          <g transform="translate(480,128)" fill="none" stroke="#2e9e3e" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M-14 15 V3 M-4 15 V-5 M6 15 V6 M16 15 V-12"/>
            <path d="M-16 -4 L-4 -14 L4 -8 L16 -20" stroke-width="2.8"/>
          </g>
          <text x="480" y="196" font-size="23" font-weight="700" text-anchor="middle" fill="#2e9e3e">Forecast growth
          </text>
          <g font-size="15" text-anchor="middle" fill="#444">
            <text x="480" y="236">Real Google searches, monthly
            </text>
            <text x="480" y="262">Expected change, years 1 to 5
            </text>
            <!--
              <text x="480" y="288">0.5 = middle of the market
              </text> -->
            </g>
            <rect x="375" y="354" width="210" height="38" rx="19" fill="#ffffff" stroke="#7fd67f" stroke-width="2"/>
            <text x="480" y="379" font-size="15" font-weight="600" text-anchor="middle" fill="#333">Trends ranked
            </text>
            <circle cx="345" cy="70" r="17" fill="#2e9e3e"/>
            <text x="345" y="76" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">2
            </text>
          </g>
          <!-- ===== 3 · Match products ===== -->
            <g>
              <rect x="665" y="70" width="270" height="340" rx="22" fill="#def3f4" stroke="#6cc4cc" stroke-width="3"/>
              <circle cx="800" cy="128" r="32" fill="#ffffff" stroke="#6cc4cc" stroke-width="3"/>
              <g transform="translate(800,128)" fill="none" stroke="#1f7f8c" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M-17 -13 H3 L17 0 L3 13 H-17 Z"/>
                <circle cx="-9" cy="0" r="2.6"/>
              </g>
              <text x="800" y="196" font-size="23" font-weight="700" text-anchor="middle" fill="#1f7f8c">Match real products
              </text>
              <g font-size="15" text-anchor="middle" fill="#444">
                <text x="800" y="230">Trends above the market middle
                </text>
                <text x="800" y="256">15 closest real products
                </text>
                <text x="800" y="282">Main category · 3 price groups
                </text>
              </g>
              <text x="800" y="316" font-size="13" font-style="italic" text-anchor="middle" fill="#5a7f84">Channel trends: “no products found”
              </text>
              <rect x="695" y="354" width="210" height="38" rx="19" fill="#ffffff" stroke="#6cc4cc" stroke-width="2"/>
              <text x="800" y="379" font-size="15" font-weight="600" text-anchor="middle" fill="#333">Product shortlist
              </text>
              <circle cx="665" cy="70" r="17" fill="#1f9aa8"/>
              <text x="665" y="76" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">3
              </text>
            </g>
            <!-- ===== 4 · Write reports ===== -->
              <g>
                <rect x="985" y="70" width="270" height="340" rx="22" fill="#ece6ff" stroke="#9d8cf0" stroke-width="3"/>
                <circle cx="1120" cy="128" r="32" fill="#ffffff" stroke="#9d8cf0" stroke-width="3"/>
                <g transform="translate(1120,128)" fill="none" stroke="#3b3470" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="-12" y="-17" width="24" height="34" rx="3.5"/>
                  <path d="M-6 -7 H6 M-6 1 H6 M-6 9 H1"/>
                </g>
                <text x="1120" y="196" font-size="23" font-weight="700" text-anchor="middle" fill="#5846c8">Write the reports
                </text>
                <g font-size="15" text-anchor="middle" fill="#444">
                  <text x="1120" y="236">STEPIC Analysis + consumer groups
                  </text>
                  <text x="1120" y="262">Facts and numbers
                  </text>
                  <text x="1120" y="288">Plain-language
                  </text>
                </g>
                <rect x="1015" y="354" width="210" height="38" rx="19" fill="#ffffff" stroke="#9d8cf0" stroke-width="2"/>
                <text x="1120" y="379" font-size="15" font-weight="600" text-anchor="middle" fill="#333">Trend PDF · EN + TH
                </text>
                <circle cx="985" cy="70" r="17" fill="#7c6ae6"/>
                <text x="985" y="76" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">4
                </text>
              </g>
              <!-- ===== 5 · Brand check ===== -->
                <g>
                  <rect x="1305" y="70" width="270" height="340" rx="22" fill="#e8eeff" stroke="#7f9cf0" stroke-width="3"/>
                  <circle cx="1440" cy="128" r="32" fill="#ffffff" stroke="#7f9cf0" stroke-width="3"/>
                  <g transform="translate(1440,128)" fill="none" stroke="#2f4aa8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="0" cy="-8" r="8.5"/>
                    <path d="M-16 17 Q-16 3 0 3 Q16 3 16 17 Z"/>
                  </g>
                  <text x="1440" y="196" font-size="23" font-weight="700" text-anchor="middle" fill="#2f4aa8">Check a brand
                  </text>
                  <text x="1440" y="224" font-size="13" font-style="italic" text-anchor="middle" fill="#5b6fb0">optional · one customer brand at a time
                  </text>
                  <g font-size="15" text-anchor="middle" fill="#444">
                    <text x="1440" y="260">Best product per trend,
                    </text>
                    <text x="1440" y="282">ranked in its category
                    </text>
                    <text x="1440" y="308">Excellent · Good · Average
                    </text>
                    <text x="1440" y="330">Below average · Gap
                    </text>
                  </g>
                  <rect x="1335" y="354" width="210" height="38" rx="19" fill="#ffffff" stroke="#7f9cf0" stroke-width="2"/>
                  <text x="1440" y="379" font-size="15" font-weight="600" text-anchor="middle" fill="#333">Brand PDF + Excel
                  </text>
                  <circle cx="1305" cy="70" r="17" fill="#4a7bf7"/>
                  <text x="1305" y="76" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">5
                  </text>
                </g>
                <!-- ===== principles strip ===== -->
                  <g>
                    <rect x="25" y="440" width="1550" height="96" rx="14" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="6 5"/>
                    <g fill="#e1f5e5" stroke="#2e9e3e" stroke-width="2">
                      <circle cx="62" cy="474" r="13"/>
                      <circle cx="837" cy="474" r="13"/>
                    </g>
                    <g fill="none" stroke="#2e9e3e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M56 474 l4 4 l8 -9"/>
                      <path d="M831 474 l4 4 l8 -9"/>
                    </g>
                    <g fill="#333">
                      <text x="86" y="480" font-size="17" font-weight="700">AI writes, rules count
                      </text>
                      <text x="86" y="506" font-size="15" fill="#555">Fixed rules produce every number
                      </text>
                      <text x="861" y="480" font-size="17" font-weight="700">Evidence first
                      </text>
                      <text x="861" y="506" font-size="15" fill="#555">Every claim quotes a real source sentence
                      </text>
                    </g>
                  </g>
                </svg>